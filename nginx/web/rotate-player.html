<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Purrtein Live</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  /* Full-bleed: tanpa border, tanpa teks, tanpa radius — murni video */
  .stage { position: fixed; inset: 0; overflow: hidden; background: #000; }
  .stage video { position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(90deg); /* 90° searah jarum jam */
    object-fit: contain; /* seluruh frame terlihat, resolusi utuh, tanpa crop */ background: #000; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <video id="video" autoplay muted playsinline></video>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
(() => {
  const video = document.getElementById('video');
  const stage = document.getElementById('stage');

  // Device code dari path: /rotate/feeder-1/ -> feeder-1
  const m = location.pathname.match(/feeder-[0-9]+/);
  if (!m) return;
  const src = `${location.origin}/${m[0]}/index.m3u8`;

  // Video landscape (4:3) di-rotate 90deg -> mengisi layar: width elemen =
  // tinggi layar, height elemen = lebar layar.
  const fit = () => {
    video.style.width  = stage.clientHeight + 'px';
    video.style.height = stage.clientWidth + 'px';
  };
  window.addEventListener('resize', fit);
  fit();

  const start = () => {
    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = src; // Safari: native HLS
      return;
    }
    if (!window.Hls || !Hls.isSupported()) return;
    // Config = persis player bawaan MediaMTX (latency & sinkronitas identik):
    // maxLiveSyncPlaybackRate = kunci sinkron — playback yang tertinggal dari
    // live edge dikejar sampai 1.5x. Sisanya default hls.js (lowLatencyMode
    // true, liveSyncDurationCount 3 → target latency sama dgn player lama).
    const hls = new Hls({ maxLiveSyncPlaybackRate: 1.5 });
    hls.on(Hls.Events.MEDIA_ATTACHED, () => hls.loadSource(src));
    hls.on(Hls.Events.MANIFEST_LOADED, () => {
      video.play().catch(() => {});
    });
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (!data.fatal) return;
      // Pola player bawaan MediaMTX: destroy + rebuild penuh setelah 2s.
      hls.destroy();
      setTimeout(start, 2000);
    });
    // Balik ke titik live setelah tab sempat di-minimize/di-pause.
    video.onplay = () => { video.currentTime = hls.liveSyncPosition; };
    hls.attachMedia(video);
  };

  if (window.Hls) start();
  else {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js';
    s.onload = start;
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
