<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Purrtein Live</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  /* Full-bleed: tanpa border, tanpa teks, tanpa radius — murni video */
  .stage { position: fixed; inset: 0; overflow: hidden; background: #000; }
  .stage video { position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(90deg); /* 90° searah jarum jam */
    object-fit: contain; /* seluruh frame terlihat, resolusi utuh, tanpa crop */ background: #000; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <video id="video" autoplay muted playsinline></video>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
(() => {
  const video = document.getElementById('video');
  const stage = document.getElementById('stage');

  // Device code dari path: /rotate/feeder-1/ -> feeder-1
  const m = location.pathname.match(/feeder-[0-9]+/);
  if (!m) return;
  const code = m[0];

  // Video landscape (4:3) di-rotate 90deg -> menempati layar: width elemen =
  // tinggi layar, height elemen = lebar layar.
  const fit = () => {
    video.style.width  = stage.clientHeight + 'px';
    video.style.height = stage.clientWidth + 'px';
  };
  window.addEventListener('resize', fit);
  fit();

  // =====================================================================
  // Jalur 1: WHEP/WebRTC — latency ~0.3-0.8s (vs HLS ~3s).
  // Endpoint: POST SDP offer ke /whep/<code>/whep (nginx -> mediamtx :8889).
  // =====================================================================

  let whepGaveUp = false;
  let whepAttempt = 0;

  const startWhep = async () => {
    if (whepGaveUp) return;
    const pc = new RTCPeerConnection();
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });

    let done = false;
    pc.ontrack = (ev) => {
      if (done) return;
      done = true;                       // media mengalir — WHEP sukses
      video.srcObject = ev.streams[0];
      video.play().catch(() => {});
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    // ICE gathering butuh waktu — tunggu complete (public host candidate cepat).
    await new Promise((res) => {
      if (pc.iceGatheringState === 'complete') return res();
      pc.addEventListener('icegatheringstatechange', () => {
        if (pc.iceGatheringState === 'complete') res();
      });
      setTimeout(res, 1500); // jangan menunggu selamanya
    });

    try {
      const resp = await fetch(`/whep/${code}/whep`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/sdp' },
        body: pc.localDescription.sdp,
      });
      if (!resp.ok) throw new Error(`whep ${resp.status}`);
      const answer = await resp.text();
      await pc.setRemoteDescription({ type: 'answer', sdp: answer });
    } catch (_) {
      pc.close();
      whepFallback();
      return;
    }

    // Kalau 8s tidak sampai 'connected' (NAT/firewall UDP 8189 tertutup),
    // serahkan ke HLS — jangan biarkan layar hitam selamanya.
    setTimeout(() => {
      if (!done && pc.connectionState !== 'connected') {
        pc.close();
        whepFallback();
      }
    }, 8000);
  };

  // =====================================================================
  // Jalur 2 (fallback): HLS via hls.js — config = persis player bawaan
  // MediaMTX (maxLiveSyncPlaybackRate = kunci sinkronitas).
  // =====================================================================

  const startHls = () => {
    const src = `${location.origin}/${code}/index.m3u8`;
    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = src; // Safari: native HLS
      return;
    }
    if (!window.Hls || !Hls.isSupported()) return;
    const hls = new Hls({ maxLiveSyncPlaybackRate: 1.5 });
    hls.on(Hls.Events.MEDIA_ATTACHED, () => hls.loadSource(src));
    hls.on(Hls.Events.MANIFEST_LOADED, () => video.play().catch(() => {}));
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (!data.fatal) return;
      hls.destroy();
      setTimeout(startHls, 2000);
    });
    video.onplay = () => { video.currentTime = hls.liveSyncPosition; };
    hls.attachMedia(video);
  };

  // WHEP gagal 2x beruntun (mis. firewall UDP 8189 tertutup) → HLS permanen.
  const whepFallback = () => {
    if (++whepAttempt >= 2) { whepGaveUp = true; startHls(); }
    else setTimeout(startWhep, 2000);
  };

  const boot = () => {
    if (window.RTCPeerConnection) startWhep();
    else startHls();
  };

  if (window.RTCPeerConnection) boot();
  else {
    // Browser jadul tanpa WebRTC — tetap bisa via HLS.
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js';
    s.onload = startHls;
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
