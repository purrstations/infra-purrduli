events {}

http {
    # redirect HTTP ke HTTPS
    server {
        listen 80;
        server_name purrduli.tech api.purrduli.tech stream.purrduli.tech admin.purrduli.tech;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # frontend (TanStack Start SSR) + API same-origin → cookie login mulus
    server {
        listen 443 ssl;
        server_name purrduli.tech;

        ssl_certificate /etc/letsencrypt/live/purrduli.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/purrduli.tech/privkey.pem;

        location /api/ {
            proxy_pass http://backend:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /socket.io/ {
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # backend API
    server {
        listen 443 ssl;
        server_name api.purrduli.tech;

        ssl_certificate /etc/letsencrypt/live/purrduli.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/purrduli.tech/privkey.pem;

        location / {
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket (chat + device events) butuh upgrade header
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # admin dashboard (TanStack Start SSR) + API same-origin (cookie admin mulus)
    server {
        listen 443 ssl;
        server_name admin.purrduli.tech;

        ssl_certificate /etc/letsencrypt/live/purrduli.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/purrduli.tech/privkey.pem;

        location /api/ {
            proxy_pass http://backend:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /socket.io/ {
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
        location / {
            proxy_pass http://dashboard:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # mediamtx
    server {
        listen 443 ssl;
        server_name stream.purrduli.tech;

        ssl_certificate /etc/letsencrypt/live/purrduli.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/purrduli.tech/privkey.pem;

        # HLS-only: serve HLS (port 8888) via TLS supaya frontend https bisa muat
        # https://stream.purrduli.tech/<device_code>/index.m3u8 tanpa mixed-content.
        # WebRTC (8889) sengaja tidak diekspos via domain - fokus smooth berbuffer.
        location / {
            proxy_pass http://mediamtx:8888;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Player rotasi 90CW (2026-09): kamera terpasang miring 90 derajat di
        # enclosure — rotasi dikerjakan CSS di browser viewer (nol transcode,
        # nol CPU VPS). HLS stream lewat apa adanya. Backend mengirim
        # whep_url = https://stream.purrduli.tech/rotate/<device_code> (nama
        # field historis, isinya URL halaman player ini).
        location /rotate/ {
            alias /var/www/rotate/;
            try_files $uri $uri/ /rotate/rotate-player.html;
        }

        # WHEP endpoint untuk player rotasi (latency ~0.5s vs HLS ~3s):
        # POST SDP offer dari browser diproxy ke WebRTC server mediamtx :8889.
        # Rewrite /whep/<code>/whep -> /<code>/whep (format endpoint mediamtx).
        # ICE: UDP 8189 wajib terbuka di firewall VPS (sudah host-mapped).
        location /whep/ {
            rewrite ^/whep/(.*)$ /$1 break;
            proxy_pass http://mediamtx:8889;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
