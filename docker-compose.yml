services:
  backend:
    # Build dari source. Repo backend harus ada di /app/backend (sibling infra) di VPS.
    # Upgrade ke image ghcr + CI kalau sudah mau deploy otomatis.
    build: ../backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
    # Tidak expose port ke host — akses hanya via nginx (api.purrduli.tech → backend:4000).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  frontend:
    # TanStack Start SSR (node-server). Repo web harus ada di /app/web (sibling infra).
    # Dockerfile-nya override NITRO_PRESET=node-server → server Node di :3000.
    # VITE_* dibaca dari .env → diteruskan sebagai build arg (Vite = build-time).
    # Biarkan VITE_API_URL/VITE_WS_URL kosong di .env → app pakai path relatif (same-origin).
    build:
      context: ../web
      # VITE_API_URL/VITE_WS_URL sengaja TIDAK dikirim → biar undefined → api.ts default "/api/v1"
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    networks:
      - internal

  dashboard:
    # TanStack Start SSR (admin dashboard). Repo di /app/admin (sibling infra).
    # VITE_API_URL di-set di Dockerfile (=/api/v1) → same-origin via nginx admin.purrduli.tech.
    build: ../admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bind loopback VPS saja — TIDAK publik. Akses dari laptop via SSH tunnel:
      #   ssh -L 5432:localhost:5432 user@145.79.10.86  → connect ke localhost:5432
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly = AOF persistence → job BullMQ selamat saat restart.
    # noeviction = jangan buang key BullMQ saat memory penuh (mitigasi job-loss).
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      # Bind loopback VPS saja — TIDAK publik. Akses dari laptop via SSH tunnel:
      #   ssh -L 6379:localhost:6379 user@145.79.10.86  → connect ke localhost:6379
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Adminer — web UI buat Postgres (edit tabel/jalanin query). Bind loopback VPS
  # saja (TIDAK publik), sama pola dgn postgres/redis. Akses dari laptop:
  #   ssh -L 8081:localhost:8081 user@145.79.10.86  → buka http://localhost:8081
  # Login: System=PostgreSQL, Server=postgres, user/pass/db dari .env.
  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres   # pre-fill kolom Server di form login
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - postgres
    networks:
      - internal

  # redis-commander — web UI buat Redis (lihat/edit key, cek job BullMQ). Loopback
  # only. Akses dari laptop:
  #   ssh -L 8082:localhost:8082 user@145.79.10.86  → buka http://localhost:8082
  # Redis tanpa password (lihat `command:` di service redis), jadi cukup host:port.
  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "127.0.0.1:8082:8081"
    depends_on:
      - redis
    networks:
      - internal

  mqtt:
    image: emqx/emqx:latest
    restart: unless-stopped
    env_file: .env
    # EMQX runs as uid 1000 (non-root) — it can't read certbot's default
    # root-only privkey even with the volume mounted. group_add gives this
    # container supplementary GID 10001, which fix-cert-perms.sh (run by the
    # certbot service) grants read access to. See certbot/fix-cert-perms.sh.
    group_add:
      - "10001"
    ports:
      - "1883:1883"             # MQTT plain (bisa di-close setelah testing)
      - "8883:8883"             # MQTT over TLS
      - "127.0.0.1:18083:18083" # EMQX dashboard — localhost only
    volumes:
      - emqx_data:/opt/emqx/data
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - internal

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: unless-stopped
    env_file: .env
    environment:
      MTX_WEBRTCADDITIONALHOSTS: "145.79.10.86"
    ports:
      - "8554:8554"       # RTSP
      - "8888:8888"       # HLS
      - "8889:8889"       # WebRTC HTTP signaling (WHEP)
      - "8189:8189/udp"   # WebRTC ICE UDP media
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml
    networks:
      - internal

  h264-ingest:
    build: ./h264-ingest-server
    restart: unless-stopped
    env_file: .env
    environment:
      MEDIAMTX_HOST: mediamtx        # nama service di network `internal`, bukan 127.0.0.1
      MEDIAMTX_RTSP_PORT: 8554
      MEDIAMTX_USER: purrtein        # RTSP tetap kirim WWW-Authenticate: Basic
                                      # walau IP sudah di-whitelist -- perlu
                                      # kredensial buat jawab challenge-nya.
      DISABLE_AUTH: ${DISABLE_AUTH:-0}   # LOCAL TEST ONLY: set DISABLE_AUTH=1 (shell env) untuk bypass token check; default 0 = aman.
      TS_MODE: ${TS_MODE:-r20}            # LOCAL TEST: stamp input fps=r20 (match device real ~20fps). Default server behavior is 25.
    ports:
      - "8080:8080"                  # ESP32-P4 push H.264 ke sini
    depends_on:
      - mediamtx
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/web:/var/www/rotate:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - internal

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./certbot/fix-cert-perms.sh:/fix-cert-perms.sh:ro
    entrypoint: >
      sh -c "trap exit TERM; while :; do
        sh /fix-cert-perms.sh;
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

volumes:
  emqx_data:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
