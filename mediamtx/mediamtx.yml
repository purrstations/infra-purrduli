logLevel: debug

# Default mediamtx (10s) LEBIH PENDEK dari reconnect window device (firmware)
# STREAM_RECONNECT_WINDOW_MS) & h264-ingest-server (RECONNECT_WINDOW_MS), yang
# dua-duanya 15s dan sengaja dibikin toleran ke TCP drop sesaat (WiFi glitch).
# Kalau mediamtx nutup publisher RTSP duluan di detik ke-10, ffmpeg yang lagi
# nunggu resume (masih hidup di ingest-server) nabrak "Broken pipe" pas device
# akhirnya reconnect — device sendiri gak pernah tau (dia cuma ngomong ke ingest-
# server, bukan mediamtx), jadi keliatan "device online tapi stream mati sendiri".
# Naikin ke 20s: lebih longgar dari 15s reconnect window manapun di pipeline ini.
readTimeout: 20s
writeTimeout: 20s
api: yes
apiAddress: :9997

rtsp: yes
rtspAddress: :8554

hls: yes
hlsAddress: :8888
# Buffering HLS klasik (fmp4 + segmen 3s x 7 = ~9-21s buffer) sudah DIBUANG:
# terbukti tidak menyembuhkan patah-patah karena akarnya starvation bandwidth
# (uplink MiFi ~1.64 Mbps < VGA@25fps), bukan jitter — buffer cuma nambah delay.
# Balik ke default mediamtx (lowLatency) supaya latency rendah tanpa buffer sia-sia.

webrtc: yes
webrtcAddress: :8889
webrtcICEUDPMuxAddress: :8189

# Auth
authMethod: internal
authInternalUsers:
  # Publish diizinkan berdasarkan IP docker network internal, bukan
  # username/password -- ffmpeg (h264-ingest-server) berulang kali kena
  # 401 di ANNOUNCE meski kredensial sudah benar & rtspAuthMethods default
  # basic; ini keterbatasan/quirk RTSP output-muxer ffmpeg, bukan salah
  # config mediamtx. IP-based auth sidestep masalah itu karena gak perlu
  # challenge-response sama sekali. Tetap aman: 172.16.0.0/12 cuma
  # reachable dari dalam docker bridge network host ini, bukan internet.
  - user: any
    ips: ["172.16.0.0/12", "127.0.0.1"]
    permissions:
      - action: publish
      - action: read        # penonton HLS masuk lewat nginx (IP 172.x) — wajib read di sini
      - action: playback
      - action: api
      - action: metrics
      - action: pprof

  # Publik boleh nonton stream (WebRTC page) tanpa login sama sekali.
  - user: any
    ips: []
    permissions:
      - action: read

paths:
  "~^feeder-[0-9]+$": {}
