logLevel: debug

api: yes
apiAddress: :9997

rtsp: yes
rtspAddress: :8554

hls: yes
hlsAddress: :8888
# HLS klasik berbuffer (BUKAN lowLatency default). Sumber ESP32 jitter -- send_ms
# sesekali melonjak ~1.5s (WiFi) -> butuh buffer player yg menyerap gap itu supaya
# tidak patah-patah. Latency HLS ~ 3 x hlsSegmentDuration (player buffer 3 segmen),
# jadi 3s -> ~9s delay. Untuk mengubah buffer, ubah hlsSegmentDuration DI SINI dan
# SELARASKAN keyframe interval di mjpeg-ingest-server/server.js (-g = fps*N,
# force_key_frames n_forced*N) supaya segmen tetap rata.
hlsVariant: fmp4
hlsSegmentDuration: 3s
hlsSegmentCount: 7

webrtc: yes
webrtcAddress: :8889
webrtcICEUDPMuxAddress: :8189

# Auth
authMethod: internal
authInternalUsers:
  # Publish diizinkan berdasarkan IP docker network internal, bukan
  # username/password -- ffmpeg (mjpeg-ingest-server) berulang kali kena
  # 401 di ANNOUNCE meski kredensial sudah benar & rtspAuthMethods default
  # basic; ini keterbatasan/quirk RTSP output-muxer ffmpeg, bukan salah
  # config mediamtx. IP-based auth sidestep masalah itu karena gak perlu
  # challenge-response sama sekali. Tetap aman: 172.16.0.0/12 cuma
  # reachable dari dalam docker bridge network host ini, bukan internet.
  - user: any
    ips: ["172.16.0.0/12", "127.0.0.1"]
    permissions:
      - action: publish
      - action: playback
      - action: api
      - action: metrics
      - action: pprof

  # Publik boleh nonton stream (WebRTC page) tanpa login sama sekali.
  - user: any
    ips: []
    permissions:
      - action: read

paths:
  "~^feeder-[0-9]+$": {}
