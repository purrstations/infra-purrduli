# EMQX config untuk Purrtein MQTT broker

node {
  name = "emqx@127.0.0.1"
  cookie = "${EMQX_NODE_COOKIE}"
  data_dir = "/opt/emqx/data"
}

# Listener MQTT plain
listeners.tcp.default {
  bind = "0.0.0.0:1883"
}

# Listener MQTT over TLS
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    certfile = "/etc/letsencrypt/live/purrduli.tech/fullchain.pem"
    keyfile  = "/etc/letsencrypt/live/purrduli.tech/privkey.pem"
  }
}

# Auth — username/password per device (built_in_database).
#
# KENAPA SEMUA FIELD DITULIS EKSPLISIT:
# Prioritas config EMQX = base.hocon < cluster.hocon < emqx.conf < env.
# Dashboard menulis ke cluster.hocon, sedangkan array `authentication` di
# emqx.conf MENIMPA PENUH definisi itu setiap node start. Blok minimal
# (tanpa password_hash_algorithm) membuat EMQX mengisi default yang bisa
# BERBEDA dari yang dipakai saat user dibuat. Hash password lalu tidak pernah
# match → seolah kredensial hilang setelah restart.
#
# Field yang valid di sini hanya: mechanism, backend, enable, user_id_type,
# password_hash_algorithm, bootstrap_file, bootstrap_type, precondition.
# `id`, `user_group`, dan `autogenerate_password` BUKAN field di EMQX 5.8.4
# (autogenerate_password baru ada di EMQX 7) — jangan ditambahkan, check_config
# akan menolak dengan `unknown_fields`.
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    enable = true
    user_id_type = username
    # sha256/suffix = default dashboard EMQX. Ditulis eksplisit supaya hash
    # tidak pernah berubah diam-diam antar restart.
    password_hash_algorithm {
      name = sha256
      salt_position = suffix
    }
    # Seed ulang user tiap authenticator di-create. bootstrap_user_from_file()
    # dipanggil dari create/1 — dan update/2 juga memanggil create/2 — jadi file
    # ini mengisi kembali user setelah authenticator di-recreate.
    # override = false: password lama TIDAK ditimpa (aman untuk rotate manual).
    bootstrap_file = "/opt/emqx/etc/extra/auth-bootstrap.csv"
    bootstrap_type = plain
  }
]

# ACL — device hanya bisa akses topic miliknya sendiri.
# Static file (bukan built_in_database) supaya rule-nya ke-track di git,
# bukan cuma ada di dashboard/database EMQX yang gak ikut ter-deploy.
# Lihat emqx/acl.conf.
authorization {
  sources = [
    { type = file, enable = true, path = "etc/acl.conf" }
  ]
  no_match = deny
  deny_action = disconnect
}
