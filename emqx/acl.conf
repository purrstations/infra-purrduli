%% Static ACL rules. Any authenticated device can publish/subscribe under
%% purrtein/devices/#. Per-device isolation would need EMQX built-in database
%% auth — file-based auth does not support ${username} placeholders in EMQX 6.

{allow, all, publish,   ["purrtein/devices/#"]}.
{allow, all, subscribe, ["purrtein/devices/#"]}.

{deny, all}.
